# hu-knowledge-ark — Docker Compose stack
#
# Két szolgáltatás:
#   - kiwix: ZIM tartalmat szolgál, beépített Xapian-alapú kereséssel
#   - landing: magyar nyelvű kezdőoldal, kategória-kártyák, térkép viewer
#
# Indítás: make up   (vagy: docker compose up -d)
# Leállítás: make down

name: hu-knowledge-ark

services:

  kiwix:
    image: ghcr.io/kiwix/kiwix-tools:latest
    container_name: hu-ark-kiwix
    restart: unless-stopped

    # Annak a usernek a UID/GID-jével írjon, akinek a DATA_DIR tartozik.
    # CIFS/NFS megosztásnál ez különösen fontos (forceuid mount opció).
    user: "${PUID:-1000}:${PGID:-1000}"

    environment:
      - TZ=${TZ:-Europe/Budapest}

    volumes:
      # A teljes data könyvtár olvasható: zim/, library.xml, maps/
      - ${DATA_DIR:-./data}:/data:ro

    # A library.xml-t használjuk (több ZIM egyszerre), a beépített web UI-val
    # és Xapian keresővel. A --port a konténer belső portja.
    command:
      - kiwix-serve
      - --library
      - /data/library.xml
      - --port
      - "8080"

    ports:
      - "${KIWIX_PORT:-8888}:8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ROOT/library/library.xml | head -c 100 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    image: hu-knowledge-ark/landing:latest
    container_name: hu-ark-landing
    restart: unless-stopped

    user: "${PUID:-1000}:${PGID:-1000}"

    # Hozzá kell adni a Docker socket csoportját (a host gépen), hogy a
    # PUID/PGID-es felhasználó tudjon a /var/run/docker.sock-ra írni.
    # A `id -g docker` paranccsal nézd meg a host gépen, és tedd be .env-be.
    group_add:
      - "${DOCKER_GID:-989}"

    environment:
      - TZ=${TZ:-Europe/Budapest}
      - KIWIX_INTERNAL_URL=http://kiwix:8080
      - KIWIX_PUBLIC_PORT=${KIWIX_PORT:-8888}
      - DATA_DIR=/data
      # A host gép DATA_DIR-je — kell a Docker socket hívásokhoz, mert a
      # daemon a host path-okat várja, nem a konténerbelit.
      - DATA_DIR_HOST=${DATA_DIR:-./data}
      - CONFIG_FILE=/app/config/content.yaml
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - KIWIX_CONTAINER=hu-ark-kiwix
      - FLASK_ENV=production
      - FLASK_SECRET=${FLASK_SECRET:-change-me-in-env}

    volumes:
      # A data RW, hogy a háttér-letöltő tudja ide menteni a ZIM-eket
      - ${DATA_DIR:-./data}:/data:rw
      # A config RW, hogy a Beállítások UI tudja menteni a content.yaml-t
      - ./config:/app/config:rw
      # Docker socket — a landing maga futtatja a kiwix-tools image-t a library
      # építéséhez és restart-olja a kiwix konténert. LAN-only stack — ne tegyél
      # a landing portjára publikus elérést, mert a socket a host root!
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "${LANDING_PORT:-5050}:5000"

    depends_on:
      kiwix:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
